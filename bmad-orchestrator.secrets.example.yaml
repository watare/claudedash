# BMAD Orchestrator Secrets Configuration
# =========================================
# Copy this file to bmad-orchestrator.secrets.yaml and fill in your values.
# IMPORTANT: bmad-orchestrator.secrets.yaml is gitignored - never commit actual secrets!

# GitHub OAuth Configuration (REQUIRED)
# Create an OAuth App at: https://github.com/settings/developers
github:
  client_id: "your_github_oauth_app_client_id"
  client_secret: "your_github_oauth_app_client_secret"

# Allowed Users (REQUIRED)
# List of GitHub usernames authorized to access the dashboard
allowed_users:
  - "your_github_username"
  # - "teammate_username"

# Optional: SSH Configuration for VPS Deployment
# Used for remote deployment operations
# ssh:
#   key_path: "~/.ssh/id_ed25519"
#   host: "your-vps-hostname"
#   user: "deploy"

# Optional: Password Authentication Users
# Fallback authentication when GitHub OAuth is unavailable
# password_users:
#   - email: "admin@example.com"
#     password_hash: "$2b$10$..." # bcrypt hash - use: npx bcrypt-cli hash 'your-password'

# Optional: Notification Webhooks
# For external notifications (Discord, Slack, custom endpoints)
# notifications:
#   webhook_url: "https://your-webhook-endpoint.com/notify"
#   slack_webhook_url: "https://hooks.slack.com/services/..."

# Anthropic API Key for Supervisor AI (RECOMMENDED)
# Used by the orchestrator to intelligently answer agent questions
# Get your API key at: https://console.anthropic.com/
anthropic:
  api_key: "sk-ant-api03-your-api-key-here"
